[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-content-agent"
version = "0.1.0"
description = "AI agent for generating monthly Facebook content for local businesses"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Chenney Zhuang", email = "dev@example.com"}]
keywords = ["ai", "agent", "social-media", "facebook", "local-business", "content-generator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    "pydantic>=2.0",
    "web-search @ git+https://github.com/ChenneyZhuang/web-search.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
perplexity = [
    "playwright>=1.40",
]

[project.scripts]
lca = "lca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
